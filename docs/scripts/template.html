<title>Vbrain Constellation</title>
<meta name="description" content="An interactive force-directed map of Venuja Nilaweera's all-of-me knowledge vault.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root{
    --bg:#080a10;
    --bg-vignette: radial-gradient(120% 120% at 50% 40%, #10141d 0%, #080a10 60%, #05060a 100%);
    --panel:#0e1119ee;
    --panel-border:#232a3a;
    --text:#e9edf6;
    --text-dim:#8891a6;
    --text-faint:#565f74;
    --hub:#7fd4ff;
    --hub-glow:#7fd4ff66;
    --project:#f2a154;
    --note:#b48eea;
    --idea:#5fd9a4;
    --person:#ff8f87;
    --edge:#3c4560;
    --edge-hi:#8fa6d6;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    background-image:var(--bg-vignette);
    color:var(--text);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  #stage{position:fixed; inset:0;}
  svg{width:100%; height:100%; display:block; cursor:grab;}
  svg:active{cursor:grabbing;}

  .link{
    stroke:var(--edge);
    stroke-width:1;
    transition:stroke .25s, stroke-width .25s, opacity .25s;
  }
  .link.hi{stroke:var(--edge-hi); stroke-width:1.6; opacity:1;}
  .link.dim{opacity:.06;}

  .node-label{
    font-family:var(--mono);
    fill:var(--text-dim);
    font-size:10px;
    pointer-events:none;
    paint-order:stroke;
    stroke:var(--bg);
    stroke-width:3px;
    stroke-linejoin:round;
    transition:opacity .2s, fill .2s;
  }
  .node-label.hub{fill:var(--hub); font-size:13px; font-weight:600;}
  .node-label.hi{fill:var(--text); opacity:1;}
  .node-label.dim{opacity:.08;}

  circle.node{
    stroke:#05060a;
    stroke-width:1.4px;
    cursor:pointer;
    transition:opacity .25s, filter .2s;
  }
  circle.node.dim{opacity:.12;}
  circle.node:hover{filter:brightness(1.35);}
  circle.node.hub{filter:drop-shadow(0 0 10px var(--hub-glow));}

  /* ---- header ---- */
  header{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:22px 26px; pointer-events:none;
    z-index:5;
  }
  .brand{pointer-events:auto;}
  .brand .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--hub); margin:0 0 4px;
  }
  .brand h1{
    font-size:20px; margin:0; font-weight:600; letter-spacing:-0.01em;
  }
  .brand p{margin:6px 0 0; font-size:12.5px; color:var(--text-dim); max-width:340px; line-height:1.5;}

  .toolbar{
    pointer-events:auto;
    display:flex; flex-direction:column; align-items:flex-end; gap:10px;
  }
  .search{
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:10px; padding:8px 12px; backdrop-filter:blur(10px);
    display:flex; align-items:center; gap:8px; width:220px;
  }
  .search svg{flex:none; opacity:.5;}
  .search input{
    background:none; border:none; outline:none; color:var(--text);
    font-family:var(--sans); font-size:13px; width:100%;
  }
  .search input::placeholder{color:var(--text-faint);}

  .legend{
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:10px; padding:10px 12px; backdrop-filter:blur(10px);
    display:flex; gap:14px; flex-wrap:wrap; justify-content:flex-end; max-width:320px;
  }
  .legend button{
    all:unset; display:flex; align-items:center; gap:6px; cursor:pointer;
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    padding:2px 4px; border-radius:6px; transition:opacity .2s;
  }
  .legend button.off{opacity:.35;}
  .legend .swatch{width:8px; height:8px; border-radius:50%; flex:none;}

  /* ---- info panel ---- */
  #panel{
    position:fixed; right:0; top:0; bottom:0; width:340px;
    max-width:88vw;
    background:var(--panel); border-left:1px solid var(--panel-border);
    backdrop-filter:blur(14px);
    transform:translateX(100%); transition:transform .32s cubic-bezier(.2,.8,.2,1);
    z-index:8; padding:26px 24px; overflow-y:auto;
  }
  #panel.open{transform:translateX(0);}
  #panel .close{
    all:unset; position:absolute; top:18px; right:18px; cursor:pointer;
    color:var(--text-faint); font-family:var(--mono); font-size:18px; line-height:1;
    padding:4px 8px; border-radius:6px;
  }
  #panel .close:hover{color:var(--text); background:#ffffff10;}
  #panel .kind{
    font-family:var(--mono); font-size:11px; text-transform:uppercase;
    letter-spacing:.1em; padding:3px 9px; border-radius:100px; display:inline-block;
    margin-bottom:14px; border:1px solid currentColor;
  }
  #panel h2{margin:0 0 6px; font-size:21px; line-height:1.25; letter-spacing:-.01em;}
  #panel .path{
    font-family:var(--mono); font-size:11px; color:var(--text-faint); margin:0 0 20px;
  }
  #panel .section-label{
    font-family:var(--mono); font-size:10px; text-transform:uppercase;
    letter-spacing:.12em; color:var(--text-faint); margin:20px 0 8px;
  }
  #panel .tags{display:flex; flex-wrap:wrap; gap:6px;}
  #panel .tag{
    font-family:var(--mono); font-size:11px; color:var(--text-dim);
    background:#ffffff0a; border:1px solid var(--panel-border);
    padding:3px 9px; border-radius:100px;
  }
  #panel .conn-list{display:flex; flex-direction:column; gap:2px;}
  #panel .conn-item{
    all:unset; display:block; cursor:pointer; font-size:13px; color:var(--text);
    padding:7px 9px; border-radius:7px; transition:background .15s;
  }
  #panel .conn-item:hover{background:#ffffff0d;}
  #panel .conn-item .t{color:var(--text-faint); font-family:var(--mono); font-size:10px; margin-right:6px;}
  #panel .empty{color:var(--text-faint); font-size:13px;}

  #hint{
    position:fixed; left:26px; bottom:22px; z-index:5;
    font-family:var(--mono); font-size:11px; color:var(--text-faint);
    display:flex; align-items:center; gap:8px; pointer-events:none;
  }
  #hint kbd{
    border:1px solid var(--panel-border); border-radius:5px; padding:1px 6px;
    background:var(--panel);
  }

  #count{
    position:fixed; left:26px; bottom:52px; z-index:5;
    font-family:var(--mono); font-size:11px; color:var(--text-faint);
  }

  @media (max-width:640px){
    header{flex-direction:column; gap:14px;}
    .toolbar{align-items:flex-start; width:100%;}
    .search{width:100%;}
    .legend{justify-content:flex-start; max-width:100%;}
    #panel{width:100%; max-width:100%;}
    #hint{display:none;}
  }
</style>

<div id="stage"><svg></svg></div>

<header>
  <div class="brand">
    <p class="eyebrow">all-of-me / vbrain1</p>
    <h1>Venuja's Constellation</h1>
    <p>Every project, note, idea and person in the vault, drawn as one living graph. Drag a node, click it to read, or search for anything.</p>
  </div>
  <div class="toolbar">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Find a node…" autocomplete="off">
    </div>
    <div class="legend" id="legend"></div>
  </div>
</header>

<div id="count"></div>
<div id="hint"><kbd>drag</kbd> move · <kbd>scroll</kbd> zoom · <kbd>click</kbd> read</div>

<div id="panel">
  <button class="close" aria-label="Close">✕</button>
  <span class="kind" id="p-kind"></span>
  <h2 id="p-title"></h2>
  <p class="path" id="p-path"></p>
  <div id="p-tags-wrap">
    <div class="section-label">Tags</div>
    <div class="tags" id="p-tags"></div>
  </div>
  <div class="section-label">Connections (<span id="p-conn-count">0</span>)</div>
  <div class="conn-list" id="p-connections"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const GRAPH_DATA = __GRAPH_DATA__;

const TYPE_COLOR = {
  hub:     getCss('--hub'),
  project: getCss('--project'),
  note:    getCss('--note'),
  idea:    getCss('--idea'),
  person:  getCss('--person'),
};
function getCss(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

const HUB_ID = 'self';
GRAPH_DATA.nodes.forEach(n => { n.kind = (n.id === HUB_ID) ? 'hub' : n.type; });

const nodeById = new Map(GRAPH_DATA.nodes.map(n => [n.id, n]));
const neighbors = new Map(GRAPH_DATA.nodes.map(n => [n.id, new Set()]));
GRAPH_DATA.links.forEach(l => {
  neighbors.get(l.source).add(l.target);
  neighbors.get(l.target).add(l.source);
});

function radiusFor(n){
  if(n.id === HUB_ID) return 22;
  const deg = neighbors.get(n.id).size;
  return Math.min(6 + deg * 1.6, 15);
}

const svg = d3.select('svg');
const g = svg.append('g');
let width = innerWidth, height = innerHeight;

svg.call(d3.zoom().scaleExtent([0.15, 5]).on('zoom', (ev) => g.attr('transform', ev.transform)));

const simulation = d3.forceSimulation(GRAPH_DATA.nodes)
  .force('link', d3.forceLink(GRAPH_DATA.links).id(d => d.id)
    .distance(l => (l.source.id === HUB_ID || l.target.id === HUB_ID) ? 190 : 55)
    .strength(l => l.weight === 1 ? 0.15 : 0.5))
  .force('charge', d3.forceManyBody().strength(d => d.id === HUB_ID ? -1400 : -140))
  .force('center', d3.forceCenter(width/2, height/2))
  .force('collide', d3.forceCollide().radius(d => radiusFor(d) + 8));

const linkSel = g.append('g').attr('class','links')
  .selectAll('line').data(GRAPH_DATA.links).join('line')
  .attr('class','link');

const nodeGroup = g.append('g').attr('class','nodes')
  .selectAll('g').data(GRAPH_DATA.nodes).join('g')
  .attr('class','node-g')
  .call(drag(simulation));

nodeGroup.append('circle')
  .attr('class', d => 'node' + (d.id===HUB_ID ? ' hub' : ''))
  .attr('r', radiusFor)
  .attr('fill', d => TYPE_COLOR[d.kind] || '#888')
  .on('click', (ev, d) => { ev.stopPropagation(); focusNode(d); })
  .on('mouseenter', (ev,d) => { if(!activeNode) hoverHighlight(d); })
  .on('mouseleave', () => { if(!activeNode) clearHighlight(); });

const labelSel = nodeGroup.append('text')
  .attr('class', d => 'node-label' + (d.id===HUB_ID ? ' hub':''))
  .attr('dx', d => radiusFor(d) + 5)
  .attr('dy', 4)
  .text(d => d.label);

simulation.on('tick', () => {
  linkSel
    .attr('x1', d=>d.source.x).attr('y1', d=>d.source.y)
    .attr('x2', d=>d.target.x).attr('y2', d=>d.target.y);
  nodeGroup.attr('transform', d => `translate(${d.x},${d.y})`);
});

function drag(sim){
  function started(ev,d){ if(!ev.active) sim.alphaTarget(0.25).restart(); d.fx=d.x; d.fy=d.y; }
  function dragged(ev,d){ d.fx=ev.x; d.fy=ev.y; }
  function ended(ev,d){ if(!ev.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }
  return d3.drag().on('start',started).on('drag',dragged).on('end',ended);
}

let activeNode = null;

function hoverHighlight(d){
  const keep = new Set([d.id, ...neighbors.get(d.id)]);
  paintHighlight(keep, d.id);
}
function clearHighlight(){
  g.selectAll('.link').classed('hi', false).classed('dim', false);
  g.selectAll('circle.node').classed('dim', false);
  g.selectAll('.node-label').classed('hi', false).classed('dim', false);
}
function paintHighlight(keepSet, centerId){
  g.selectAll('circle.node').classed('dim', d => !keepSet.has(d.id));
  g.selectAll('.node-label')
    .classed('dim', d => !keepSet.has(d.id))
    .classed('hi', d => keepSet.has(d.id) && d.id !== HUB_ID);
  g.selectAll('.link')
    .classed('hi', l => l.source.id === centerId || l.target.id === centerId)
    .classed('dim', l => !(l.source.id === centerId || l.target.id === centerId));
}

const panel = document.getElementById('panel');
document.querySelector('#panel .close').addEventListener('click', () => { activeNode=null; panel.classList.remove('open'); clearHighlight(); });
svg.on('click', () => { activeNode=null; panel.classList.remove('open'); clearHighlight(); });

function focusNode(d){
  activeNode = d;
  const keep = new Set([d.id, ...neighbors.get(d.id)]);
  paintHighlight(keep, d.id);
  document.getElementById('p-kind').textContent = d.kind.toUpperCase();
  document.getElementById('p-kind').style.color = TYPE_COLOR[d.kind] || '#888';
  document.getElementById('p-title').textContent = d.label;
  document.getElementById('p-path').textContent = d.id==='self' ? 'people/self.md' : (d.group + '/' + d.id + '.md');

  const tagsWrap = document.getElementById('p-tags-wrap');
  const tagsEl = document.getElementById('p-tags');
  tagsEl.innerHTML = '';
  if(d.tags && d.tags.length){
    tagsWrap.style.display = '';
    d.tags.forEach(t => {
      const s = document.createElement('span');
      s.className='tag'; s.textContent = t;
      tagsEl.appendChild(s);
    });
  } else { tagsWrap.style.display = 'none'; }

  const list = document.getElementById('p-connections');
  list.innerHTML = '';
  const conns = [...neighbors.get(d.id)].map(id => nodeById.get(id)).sort((a,b)=>a.label.localeCompare(b.label));
  document.getElementById('p-conn-count').textContent = conns.length;
  if(conns.length === 0){
    const e = document.createElement('div'); e.className='empty'; e.textContent='No linked entries yet.';
    list.appendChild(e);
  }
  conns.forEach(n => {
    const b = document.createElement('button');
    b.className='conn-item';
    b.innerHTML = `<span class="t">${n.kind}</span>${n.label}`;
    b.addEventListener('click', (ev) => { ev.stopPropagation(); focusNode(n); });
    list.appendChild(b);
  });

  panel.classList.add('open');
}

// legend
const legend = document.getElementById('legend');
const kinds = [
  ['hub','Venuja'], ['project','Projects'], ['note','Notes'], ['idea','Ideas'], ['person','People']
];
const hidden = new Set();
kinds.forEach(([k,label]) => {
  const btn = document.createElement('button');
  btn.innerHTML = `<span class="swatch" style="background:${TYPE_COLOR[k]}"></span>${label}`;
  btn.addEventListener('click', () => {
    if(hidden.has(k)) hidden.delete(k); else hidden.add(k);
    btn.classList.toggle('off');
    applyFilter();
  });
  legend.appendChild(btn);
});
function applyFilter(){
  g.selectAll('circle.node').style('display', d => hidden.has(d.kind) ? 'none' : null);
  g.selectAll('.node-label').style('display', d => hidden.has(d.kind) ? 'none' : null);
  g.selectAll('.link').style('display', l => (hidden.has(l.source.kind) || hidden.has(l.target.kind)) ? 'none' : null);
}

// search
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if(!q){ clearHighlight(); return; }
  const matches = GRAPH_DATA.nodes.filter(n => n.label.toLowerCase().includes(q));
  const keep = new Set(matches.map(n=>n.id));
  g.selectAll('circle.node').classed('dim', d => !keep.has(d.id));
  g.selectAll('.node-label').classed('dim', d => !keep.has(d.id)).classed('hi', d => keep.has(d.id));
  g.selectAll('.link').classed('dim', true).classed('hi', false);
});
searchInput.addEventListener('keydown', (ev) => {
  if(ev.key === 'Enter'){
    const q = searchInput.value.trim().toLowerCase();
    const match = GRAPH_DATA.nodes.find(n => n.label.toLowerCase().includes(q));
    if(match) focusNode(match);
  }
});

document.getElementById('count').textContent = `${GRAPH_DATA.nodes.length} entries · ${GRAPH_DATA.links.length} connections`;

addEventListener('resize', () => {
  width = innerWidth; height = innerHeight;
  simulation.force('center', d3.forceCenter(width/2, height/2));
  simulation.alpha(0.3).restart();
});
</script>
